<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>自転車事故防止アプリ</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- CSV を読み込むための PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
}

#map{
  height:100vh;
  width:100%;
}

#startBtn{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  font-size:30px;
  padding:20px 50px;
  border:none;
  border-radius:15px;
  background:black;
  color:white;
}

#warning{
  display:none;
  position:fixed;
  top:100px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  background:red;
  color:white;
  font-size:30px;
  font-weight:bold;
  padding:20px 40px;
  border-radius:15px;
}

.blink{
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:0;}
}
</style>
</head>

<body>

<button id="startBtn" onclick="startApp()">START</button>

<div id="warning">⚠ 危険区域</div>

<div id="map"></div>

<script>

// ----------------------------
// 地図初期化
// ----------------------------
const map = L.map('map').setView([35.6872027,139.8208808], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap'
}).addTo(map);


// ----------------------------
// CSV から危険区域を読み込む
// ----------------------------
let dangerZones = [];

Papa.parse("https://muuuu25.github.io/accident-map/accidents.csv", {
  download: true,
  header: true,
  complete: function(results) {

    const data = results.data;

    dangerZones = data
      .filter(row => row["緯度"] && row["経度"])   // 空行を除外
      .map(row => {

        const lat = parseFloat(row["緯度"]);
        const lon = parseFloat(row["経度"]);

        const dead = parseInt(row["死者数"] || 0);
        const injured = parseInt(row["負傷者数"] || 0);

        // 危険度に応じて半径を変える
        const radius = (injured * 20) + (dead * 100);

        return {
          lat: lat,
          lon: lon,
          radius: radius
        };
      });

    console.log("読み込んだ危険区域:", dangerZones);

    // 地図に描画
    dangerZones.forEach(zone => {
      L.circle([zone.lat, zone.lon], {
        radius: zone.radius,
        color: "red",
        fillColor: "#ff0000",
        fillOpacity: 0.3
      }).addTo(map);
    });

  }
});


// ----------------------------
// ユーザー位置マーカー
// ----------------------------
let userMarker = L.marker([0,0]).addTo(map);

let vibrationInterval = null;
const warningDiv = document.getElementById("warning");


// ----------------------------
// START ボタン
// ----------------------------
function startApp(){

  document.getElementById("startBtn").style.display="none";

  navigator.geolocation.watchPosition(

    pos => {

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      userMarker.setLatLng([lat,lon]);
      map.setView([lat,lon]);

      let isInside = false;

      // 危険区域判定
      dangerZones.forEach(zone => {
        const d = map.distance([lat,lon], [zone.lat, zone.lon]);
        if(d < zone.radius){
          isInside = true;
        }
      });

      // 危険区域内
      if(isInside){

        warningDiv.style.display = "block";
        warningDiv.classList.add("blink");

        if(!vibrationInterval && navigator.vibrate){
          vibrationInterval = setInterval(()=>{
            navigator.vibrate([300,200]);
          },500);
        }

      }

      // 危険区域外
      else{

        warningDiv.style.display = "none";
        warningDiv.classList.remove("blink");

        if(vibrationInterval){
          clearInterval(vibrationInterval);
          navigator.vibrate(0);
          vibrationInterval = null;
        }

      }

    },

    err => {
      alert("位置情報エラー:"+err.message);
    }

  );

}

</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
