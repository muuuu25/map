<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>自転車事故防止アプリ</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    #map {
      height: 800px;
    }

    #warning {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: red;
      color: white;
      font-size: 30px;
      padding: 20px 40px;
      border-radius: 15px;
      z-index: 1000;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #startBtn {
      font-size: 30px;
      padding: 30px 50px;
      border-radius: 15px;
      background: green;
      color: white;
      border: none;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<button id="startBtn" onclick="startApp()">
  スタート
</button>

<h2>自転車事故防止アプリ</h2>

<div id="map"></div>

<div id="warning">
  ⚠ 危険区域に入りました！
</div>

<script>

// =======================
// 振動用
// =======================
let vibrationInterval = null;

// =======================
// 地図表示
// =======================
const map = L.map('map').setView([35.6872027, 139.8208808], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  noWrap: true,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// =======================
// 手動危険区域
// =======================
const dangerZones = [
  {
    lat: 35.6872027,
    lon: 139.8208808,
    radius: 80
  }
];

// =======================
// CSV危険区域保存用
// =======================
const csvZones = [];

// =======================
// 手動危険区域描画
// =======================
dangerZones.forEach(zone => {

  L.circle([zone.lat, zone.lon], {
    radius: zone.radius,
    color: "red",
    fillColor: "#f03",
    fillOpacity: 0.3
  }).addTo(map);

});

// =======================
// 学校位置
// =======================
const schoolLat = 35.6872027;
const schoolLon = 139.8208808;

// =======================
// CSV読み込み
// =======================
fetch("/map/honhyo_2024.csv")

  .then(res => {
    console.log("status:", res.status);
    return res.text();
  })

  .then(text => {

    const lines = text.split(/\r?\n/).slice(1);

    lines.forEach(line => {

      const cols = line.split(",");

      // 緯度経度取得
      const lat = parseFloat(cols[1]) / 10000000;
      const lon = parseFloat(cols[2]) / 10000000;

      // 数値確認
      if (!isNaN(lat) && !isNaN(lon)) {

        // =======================
        // 学校周辺だけ表示
        // =======================
        if (
          Math.abs(lat - schoolLat) < 0.01 &&
          Math.abs(lon - schoolLon) < 0.01
        ) {

          // 円表示
          L.circle([lat, lon], {
            radius: 80,
            color: "orange",
            fillColor: "#ff6600",
            fillOpacity: 0.4
          }).addTo(map);

          // 判定用保存
          csvZones.push({
            lat: lat,
            lon: lon,
            radius: 80
          });
        }
      }
    });

    console.log("CSV読み込み完了:", csvZones.length);

  })

  .catch(err => {
    console.error("CSVエラー:", err);
  });

// =======================
// ユーザーマーカー
// =======================
let userMarker = L.marker([0, 0]).addTo(map);

const warningDiv = document.getElementById("warning");

let insideZone = false;

// =======================
// スタート
// =======================
function startApp() {

  // ボタン非表示
  document.getElementById("startBtn").style.display = "none";

  navigator.geolocation.watchPosition(

    pos => {

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      // 現在地更新
      userMarker.setLatLng([lat, lon]);

      // 地図移動
      map.setView([lat, lon]);

      let isInside = false;

      // =======================
      // 手動危険区域判定
      // =======================
      dangerZones.forEach(zone => {

        const d = map.distance(
          [lat, lon],
          [zone.lat, zone.lon]
        );

        if (d < zone.radius) {
          isInside = true;
        }

      });

      // =======================
      // CSV危険区域判定
      // =======================
      csvZones.forEach(zone => {

        const d = map.distance(
          [lat, lon],
          [zone.lat, zone.lon]
        );

        if (d < zone.radius) {
          isInside = true;
        }

      });

      console.log("危険:", isInside);

      // =======================
      // 危険区域内
      // =======================
      if (isInside) {

        warningDiv.style.display = "block";
        warningDiv.classList.add("blink");

        // 入った瞬間だけ音
        if (!insideZone) {

          const audio = new Audio("beep.mp3");
          audio.play();

        }

        // 振動開始
        if (!vibrationInterval && navigator.vibrate) {

          vibrationInterval = setInterval(() => {
            navigator.vibrate([300, 200]);
          }, 500);

        }
      }

      // =======================
      // 危険区域外
      // =======================
      if (!isInside) {

        warningDiv.style.display = "none";
        warningDiv.classList.remove("blink");

        // 振動停止
        if (vibrationInterval) {

          clearInterval(vibrationInterval);

          navigator.vibrate(0);

          vibrationInterval = null;
        }
      }

      insideZone = isInside;

    },

    err => {
      alert("位置情報エラー: " + err.message);
    }

  );
}

</script>

</body>
</html>
